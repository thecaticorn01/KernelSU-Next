name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      manager_package:
        description: 'manager package name'
        required: false
        default: ''
        type: string
      expected_manager_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_manager_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
      samsung:
        description: 'enable Samsung KDP/RKP/DEFEX late-load compat (aarch64 ksu LKM)'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      samsung:
        description: 'enable Samsung KDP/RKP/DEFEX late-load compat (aarch64 ksu LKM)'
        required: false
        default: false
        type: boolean
jobs:
  build-lkm-ksu:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-ksu.yml
    with:
      kmi: ${{ matrix.kmi }}
      manager_package: ${{ inputs.manager_package || '' }}
      expected_manager_size: ${{ inputs.expected_manager_size || '' }}
      expected_manager_hash: ${{ inputs.expected_manager_hash || '' }}
      samsung: ${{ inputs.samsung || false }}
  
  build-lkm-susfs:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-susfs.yml
    with:
      kmi: ${{ matrix.kmi }}
